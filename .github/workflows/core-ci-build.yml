name: core-ci source build
run-name: core-ci build ${{ inputs.attempt }} ${{ inputs.assignment_sha256 }}
on:
  workflow_dispatch:
    inputs:
      execution:
        required: true
        type: string
      attempt:
        required: true
        type: string
      assignment_sha256:
        required: true
        type: string
      assignment:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  build:
    uses: VOC-Experiments/ci-coordinator/.github/workflows/core-ci-build.yml@fa07d7847964286e81bb1d7b71634b2d73d4e1ad
    with:
      execution: ${{ inputs.execution }}
      attempt: ${{ inputs.attempt }}
      assignment_sha256: ${{ inputs.assignment_sha256 }}
      assignment: ${{ inputs.assignment }}
